<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1B8A4A">
    <title>АрбитрПро — Вход</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="logo-block">
            <div class="logo-icon">А</div>
            <h1 class="logo-title">АРБИТРПРО</h1>
            <p class="logo-subtitle">Личный кабинет должника</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="inn">ИНН</label>
                <input type="tel" id="inn" name="inn" maxlength="12" inputmode="numeric"
                       placeholder="502712345678" autocomplete="off">
                <span class="field-hint" id="innHint">12 цифр</span>
            </div>

            <div class="form-group">
                <label for="snils">СНИЛС</label>
                <input type="tel" id="snils" name="snils" maxlength="14" inputmode="numeric"
                       placeholder="123-456-789 01" autocomplete="off">
                <span class="field-hint" id="snilsHint">Формат: XXX-XXX-XXX XX</span>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Войти</button>

            <div class="auth-error" id="authError" style="display:none;">
                Данные не найдены. Проверьте ИНН и СНИЛС.
            </div>

            <a href="#" class="auth-help" id="helpLink">
                Забыли данные или не можете войти? Напишите нам
            </a>
        </form>

        <div class="auth-footer">
            © АрбитрПро, 2026
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
